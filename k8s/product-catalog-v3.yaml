# Product Catalog v3: storage, Deployment and Service.
# Open at http://localhost:8083 (Docker Desktop publishes LoadBalancer ports on localhost).
---
# Each version gets its own volume, so v1, v2 and v3 never share a database.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: product-catalog-v3-data
  namespace: product-catalog
  labels: {app: product-catalog, version: v3}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog-v3
  namespace: product-catalog
  labels: {app: product-catalog, version: v3}
spec:
  replicas: 1
  # SQLite lives on a ReadWriteOnce volume: stop the old pod before starting
  # the new one, so two pods never write the same database file.
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: product-catalog, version: v3}
  template:
    metadata:
      labels: {app: product-catalog, version: v3}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000        # appuser in the image
        runAsGroup: 1000
        fsGroup: 1000          # makes the mounted volume writable by appuser
      containers:
        - name: product-catalog
          image: docker.io/shehfin/product-catalog:v3
          # Jenkins republishes the same tag (v3) on every build, so always
          # check Docker Hub for a newer image when a pod starts.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: DATABASE_PATH
              value: /app/data/products.db
            - name: LOW_STOCK_THRESHOLD   # products with quantity below this are "low stock"
              value: "10"
            - name: SECRET_KEY            # created with kubectl, never stored in YAML
              valueFrom:
                secretKeyRef:
                  name: product-catalog-secret
                  key: SECRET_KEY
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          # v3 has GET /health, which returns 503 if the database can't be read.
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: product-catalog-v3-data
---
apiVersion: v1
kind: Service
metadata:
  name: product-catalog-v3-service
  namespace: product-catalog
  labels: {app: product-catalog, version: v3}
spec:
  type: LoadBalancer
  selector: {app: product-catalog, version: v3}
  ports:
    - name: http
      port: 8083          # http://localhost:8083
      targetPort: http
