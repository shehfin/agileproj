<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Products{% endblock %} · Product Catalog</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ url_for('products.index') }}">Product Catalog</a>
      <nav class="nav">
        <a href="{{ url_for('products.index') }}">Products</a>
        <a href="{{ url_for('products.add_product') }}">Add Product</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="container footer">
    Product Catalog {{ app_version }} · Student ID 24MIS0175
  </footer>
</body>
</html>
